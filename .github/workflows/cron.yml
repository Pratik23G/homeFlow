# Calls the reminder and follow-up endpoints every 15 minutes.
# Vercel's free (Hobby) plan only allows daily crons, so this does the frequent runs for free.
# Both endpoints are idempotent: running them often never emails anyone twice.
# Setup: repo Settings -> Secrets and variables -> Actions -> add SITE_URL (https://your-domain, no trailing slash)
# and CRON_SECRET (same value as on Vercel).
name: HomeFlow cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Reminders and follow-ups
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          for path in reminders followups; do
            curl --fail --silent --show-error --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/$path"
            echo
          done
